<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 font-weight-normal">
        <a class="text-decoration-none text-dark" href="{% url 'catalog:home' %}">Skystore</a>
    </h5>
    <nav class="ms-md-4 d-flex flex-wrap align-items-center gap-2">
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'blog:list' %}">Блог</a>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'catalog:contacts' %}">Контакты</a>
    </nav>
    <div class="ms-md-auto d-flex flex-wrap align-items-center gap-2 mt-2 mt-md-0">
        {% if user.is_authenticated %}
        <span class="text-muted small">{{ user.email }}</span>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Выйти</button>
        </form>
        {% else %}
        <a class="btn btn-outline-primary btn-sm" href="{% url 'users:login' %}">Войти</a>
        <a class="btn btn-primary btn-sm" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </div>
</div>
