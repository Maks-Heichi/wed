{% extends "catalog/base.html" %}

{% block title %}Удаление статьи — Блог{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h3 mb-3">Удалить статью?</h1>
    <p class="text-muted">«{{ object.title }}» будет удалена без возможности восстановления.</p>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
